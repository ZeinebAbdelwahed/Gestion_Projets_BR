<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold"><i class="bi bi-box me-2 text-info"></i>Ressources</h2>
  <button class="btn btn-info text-dark" (click)="openNew()">
    <i class="bi bi-plus-lg me-1"></i> Ajouter
  </button>
</div>

<div class="alert alert-danger" *ngIf="errorMsg">{{ errorMsg }}</div>

<!-- Formulaire -->
<div class="card shadow-sm mb-4" *ngIf="showForm">
  <div class="card-body">
    <h5 class="card-title mb-3">{{ editMode ? 'Modifier' : 'Nouvelle' }} ressource</h5>
    <form (ngSubmit)="save()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nom *</label>
          <input class="form-control" [(ngModel)]="ressource.nom" name="nom" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Type *</label>
          <select class="form-select" [(ngModel)]="ressource.type" name="type" required>
            <option value="" disabled>-- Sélectionner --</option>
            <option *ngFor="let t of types" [value]="t">{{ t }}</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Coût (€/j) *</label>
          <input class="form-control" type="number" [(ngModel)]="ressource.cout" name="cout" min="0" required>
        </div>
        <div class="col-md-6 d-flex align-items-center pt-4">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" [(ngModel)]="ressource.disponibilite" name="disponibilite" id="dispo">
            <label class="form-check-label" for="dispo">Disponible</label>
          </div>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-lg me-1"></i> Enregistrer
        </button>
        <button type="button" class="btn btn-secondary" (click)="showForm=false">Annuler</button>
      </div>
    </form>
  </div>
</div>

<!-- Tableau -->
<div class="card shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Type</th>
          <th>Coût (€/j)</th>
          <th>Disponibilité</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of ressources">
          <td>{{ r.id }}</td>
          <td>{{ r.nom }}</td>
          <td><span class="badge bg-secondary">{{ r.type }}</span></td>
          <td>{{ r.cout | currency:'EUR':'symbol':'1.0-2':'fr' }}</td>
          <td>
            <span class="badge" [ngClass]="r.disponibilite ? 'bg-success' : 'bg-danger'">
              {{ r.disponibilite ? 'Disponible' : 'Indisponible' }}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" (click)="openEdit(r)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="delete(r.id!)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="ressources.length === 0">
          <td colspan="6" class="text-center text-muted py-4">Aucune ressource trouvée.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
