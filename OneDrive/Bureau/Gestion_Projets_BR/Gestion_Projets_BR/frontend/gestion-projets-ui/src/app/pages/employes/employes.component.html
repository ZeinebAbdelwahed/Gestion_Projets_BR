<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold"><i class="bi bi-people me-2 text-primary"></i>Employés</h2>
  <button class="btn btn-primary" (click)="openNew()">
    <i class="bi bi-plus-lg me-1"></i> Ajouter
  </button>
</div>

<div class="alert alert-danger" *ngIf="errorMsg">{{ errorMsg }}</div>

<!-- Formulaire inline -->
<div class="card shadow-sm mb-4" *ngIf="showForm">
  <div class="card-body">
    <h5 class="card-title mb-3">{{ editMode ? 'Modifier' : 'Nouvel' }} employé</h5>
    <form (ngSubmit)="save()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nom *</label>
          <input class="form-control" [(ngModel)]="employe.nom" name="nom" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email *</label>
          <input class="form-control" type="email" [(ngModel)]="employe.email" name="email" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Rôle *</label>
          <input class="form-control" [(ngModel)]="employe.role" name="role" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Équipe</label>
          <input class="form-control" [(ngModel)]="employe.equipe" name="equipe">
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-lg me-1"></i> Enregistrer
        </button>
        <button type="button" class="btn btn-secondary" (click)="showForm=false">Annuler</button>
      </div>
    </form>
  </div>
</div>

<!-- Tableau -->
<div class="card shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Rôle</th>
          <th>Équipe</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of employes">
          <td>{{ e.id }}</td>
          <td>{{ e.nom }}</td>
          <td>{{ e.email }}</td>
          <td><span class="badge bg-info text-dark">{{ e.role }}</span></td>
          <td>{{ e.equipe || '—' }}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" (click)="openEdit(e)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="delete(e.id!)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="employes.length === 0">
          <td colspan="6" class="text-center text-muted py-4">Aucun employé trouvé.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
